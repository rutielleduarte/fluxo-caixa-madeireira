<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxo de Caixa - Madeireira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>Fluxo de caixa</h1>
    <p>Madeireira</p>
  </header>

  <main>
    <section class="resumo" aria-label="Resumo financeiro">
      <label class="saldo-inicial">Saldo inicial (R$)
        <input type="number" id="saldoInicial" step="0.01" value="1000">
      </label>
      <div class="indicador"><span>Receitas</span><strong id="totalReceitas" class="pos">R$ 0,00</strong></div>
      <div class="indicador"><span>Despesas</span><strong id="totalDespesas" class="neg">R$ 0,00</strong></div>
      <div class="indicador saldo"><span>Saldo atual</span><strong id="saldoFinal">R$ 0,00</strong></div>
    </section>

    <div class="colunas">
      <section class="painel" aria-labelledby="tituloForm">
        <h2 id="tituloForm">Novo lançamento</h2>
        <form id="formLancamento">
          <input type="hidden" id="idLancamento">
          <label>Descrição <input id="descricao" required maxlength="255"></label>
          <div class="linha">
            <label>Tipo
              <select id="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
              </select>
            </label>
            <label>Valor (R$) <input id="valor" type="number" step="0.01" min="0.01" required></label>
          </div>
          <div class="linha">
            <label>Data <input id="data" type="date" required></label>
            <label>Forma de pagamento
              <select id="forma">
                <option value="">Não informada</option>
                <option>Dinheiro</option>
                <option>Pix</option>
                <option>Cartão</option>
                <option>Boleto</option>
                <option>Transferência</option>
              </select>
            </label>
          </div>
          <label>Categoria <select id="categoria"></select></label>
          <label>Observação <textarea id="observacao" rows="2"></textarea></label>
          <p id="mensagem" role="status"></p>
          <div class="acoes">
            <button type="submit" id="btnSalvar">Salvar lançamento</button>
            <button type="button" id="btnCancelar" class="secundario" hidden>Cancelar edição</button>
          </div>
        </form>
      </section>

      <section class="painel" aria-labelledby="tituloLista">
        <h2 id="tituloLista">Lançamentos</h2>
        <div class="filtros">
          <input id="busca" type="search" placeholder="Buscar por descrição" aria-label="Buscar por descrição">
          <select id="filtroTipo" aria-label="Filtrar por tipo">
            <option value="">Todos</option>
            <option value="entrada">Entradas</option>
            <option value="saida">Saídas</option>
          </select>
          <input id="dataInicial" type="date" aria-label="Data inicial">
          <input id="dataFinal" type="date" aria-label="Data final">
        </div>
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr><th>Data</th><th>Descrição</th><th>Tipo</th><th class="num">Valor</th><th></th></tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
